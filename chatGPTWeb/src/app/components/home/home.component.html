<div *ngIf="!isAuthenticated" class="login-container">
    <h2>Password </h2>
    <form (ngSubmit)="onSubmitpass()">
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
        <button type="submit">Submit</button>
        <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
    </form>
</div>

<div *ngIf="isAuthenticated">
    <!--<div class="chat-container" *ngIf="start">-->
    <div *ngIf="messages.length > 0" class="chat-window">
        <div *ngFor="let message of messages">
            <div *ngIf="message.contentShort != undefined"
                 [ngClass]="{'role-message': message.role === 'system', 'chat-message': message.role === 'assistant',
             'without-content': message.contentShort === undefined}">

                <strong *ngIf="message.role == 'system'; else elseBlock">researcher</strong>
                <ng-template #elseBlock>
                    <strong>{{ message.role }}</strong>
                </ng-template>

                <div *ngIf="message.jsonObject">
                    <ul>
                        <li *ngFor="let key of objectKeys(message.contentShort)">
                            <span class="json-key">{{ key }}:</span>
                            <ng-container *ngIf="isObject(message.contentShort[key]); else showValue">
                            </ng-container>
                            <ng-template #showValue>

                                <!-- Check if the value is not an array -->
                                <ng-container *ngIf="!Array.isArray(message.contentShort[key])">
                                    <span class="json-value">{{ message.contentShort[key] }}</span>
                                </ng-container>

                                <!-- Check if the value is an array and use *ngFor to iterate -->
                                <ng-container *ngIf="Array.isArray(message.contentShort[key])">
                                    <span class="json-value"
                                          *ngFor="let item of message.contentShort[key]">{{ item }}</span>
                                </ng-container>
                            </ng-template>
                        </li>
                    </ul>
                </div>
                <div style="white-space: pre-line;" *ngIf="!message.jsonObject">
                    {{ message.contentShort }}
                </div>
                <!-- Expandable content -->
                <div class="examples-message" *ngIf="isExamplesVisible(message)">
                    <strong>Examples section</strong>
                    <div style="white-space: pre-line;">
                        {{ message.examples }}
                    </div>
                </div>
                <div *ngIf="message.examples" class="mt-1 mb-0">
                    <!-- Link to toggle expand/collapse with CSS class -->
                    <a href="#" (click)="toggleExamples(message); $event.preventDefault();" class="underline-link">
                        {{ isExamplesVisible(message) ? 'Hide Examples' : 'Show Examples' }}
                    </a>
                </div>
            </div>

        </div>
    </div>

    <div class="chat-input" *ngIf="this.stageSubject.value==stages.Start">
        <form (ngSubmit)="onSubmit()" #fileUploadForm="ngForm">
            <input type="file" (change)="onFileChange($event)" accept=".zip"/>
            <button type="submit">Upload</button>
        </form>
    </div>
    <div class="chat-input" *ngIf="this.stageSubject.value==stages.Start">

        <!--<input [(ngModel)]="projectUuid" placeholder="Type your project location here..."/>-->
        <button (click)="changeStage(stages.ProjectLocation)">Use a previous project</button>
    </div>

    <div class="chat-input" *ngIf="this.stageSubject.value!=stages.Start">
        <input [(ngModel)]="userMessage" placeholder="Type your message here..." (keydown.enter)="sendMessage()"/>
        <button (click)="sendMessage()">Send</button>
    </div>
</div>
